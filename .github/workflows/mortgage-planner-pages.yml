name: Deploy mortgage planner to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "mortgage-planner/**"
      - ".github/workflows/mortgage-planner-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "mortgage-planner-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: mortgage-planner
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
