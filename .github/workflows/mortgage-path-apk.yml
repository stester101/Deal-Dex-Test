name: Build MortgagePath APK

on:
  push:
    branches:
      - chatgpt-mortgage-path-build-20260926
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Restore MortgagePath source
        shell: bash
        run: |
          cat mortgage-build/source.b64.* | base64 -d > /tmp/mortgage-app-source.zip
          unzip -q /tmp/mortgage-app-source.zip

      - name: Build debug APK
        working-directory: mortgage-app
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MortgagePath-APK
          path: mortgage-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
